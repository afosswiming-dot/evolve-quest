<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Missões atribuídas | EVOLVE Quest</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="/healer/shared/healer-tokens.css"><link rel="stylesheet" href="/healer/shared/healer-shell.css"></head><body>
<div class="app-shell"><aside class="sidebar"></aside>
<main><nav class="eq-content-nav" aria-label="Conteúdo de Missões"><a href="/healer/missoes/">Biblioteca de Missões</a><a href="/healer/capitulos/">Missões por Capítulo</a><a href="/healer/treinos/">Missões atribuídas</a></nav><header class="topbar"><div><span class="eyebrow">PRESCRIÇÃO INDIVIDUAL</span><h1>Missões atribuídas</h1><p>Use Alpha, Bravo e Charlie como base e personalize cada Missão individualmente.</p></div><button id="refreshBtn" class="btn secondary">Atualizar</button></header><section class="toolbar panel"><input id="searchInput" placeholder="Buscar Aventureiro..."><select id="statusFilter"><option value="">Todos os ativos</option><option value="with">Com Missões</option><option value="without">Sem Missões</option></select></section><div id="status" class="status">Carregando...</div><section id="adventurerGrid" class="grid"></section></main></div>
<div id="editor" class="overlay"><div class="drawer"><header><div><span class="eyebrow">EDITOR INDIVIDUAL</span><h2 id="editorTitle">Nova Missão</h2><p id="editorAdventurer"></p></div><button id="closeEditor" class="close">×</button></header>
<div class="fields"><label>Nome<input id="missionName"></label><label>Modelo<select id="missionType"><option value="alpha">Alpha</option><option value="bravo">Bravo</option><option value="charlie">Charlie</option></select></label><label>Ambiente<select id="missionEnvironment"><option value="gym">Academia</option><option value="home">Casa</option></select></label><label>Duração (min)<input id="missionDuration" type="number" min="1" value="45"></label><label class="wide">Legenda<input id="missionSubtitle"></label><label class="wide">Objetivo<textarea id="missionObjective" rows="3"></textarea></label></div>
<section class="template-actions" aria-label="Modelos prontos">
<label for="templateSearch">Pesquisar modelos<input id="templateSearch" type="search" placeholder="Nome, código ou capítulo"></label>
<div class="template-filters"><label>Ambiente<select id="templateEnvironment"><option value="">Todos</option><option value="gym">Academia</option><option value="home">Casa</option></select></label><label>Status editorial<select id="templateStatusFilter"><option value="">Publicados e rascunhos</option><option value="available">Publicado</option><option value="draft">Rascunho</option></select></label></div>
<label for="templateSelect">Selecionar modelo pronto</label><select id="templateSelect" aria-describedby="templateStatus"><option value="">Selecione um modelo</option></select>
<p id="templateStatus" role="status" aria-live="polite"></p>
<div class="template-buttons"><button id="reloadTemplates" class="btn secondary">Atualizar modelos</button><button id="loadTemplate" class="btn secondary" disabled>Carregar modelo selecionado</button></div>
</section>
<div class="section-head"><div><span class="eyebrow">COMPOSIÇÃO</span><h3>Exercícios da Missão</h3></div><button id="openLibrary" class="btn primary">+ Adicionar exercício</button></div><div id="composition"></div><div class="savebar"><button id="saveMission" class="btn primary">Salvar para este Aventureiro</button></div></div></div>
<div id="libraryModal" class="overlay"><div class="modal"><header><div><span class="eyebrow">BIBLIOTECA</span><h2>Selecionar exercícios</h2></div><button id="closeLibrary" class="close">×</button></header><div class="toolbar"><input id="librarySearch" placeholder="Buscar exercício..."><select id="libraryEnvironment"><option value="">Todos</option><option value="gym">Academia</option><option value="home">Casa</option></select></div><div id="libraryList" class="library"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/healer/shared/healer-ui.js"></script><script src="/healer/shared/healer-shell.js"></script><script src="app.js"></script><script src="/healer/shared/healer-components.js"></script></body></html>
