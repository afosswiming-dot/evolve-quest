<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pré-visualização da Missão — EVOLVE Quest</title>
  <meta name="description" content="Pré-visualização editorial de uma Missão da EVOLVE Quest.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<a class="skip-link" href="#main">Pular para o conteúdo</a>
<main id="main" class="page">
  <header class="topbar">
    <a class="back-link" href="/healer/missoes/">← Voltar às Missões</a>
    <div class="brand"><span class="brand-mark">EQ</span><div><strong>EVOLVE Quest</strong><small>Pré-visualização editorial</small></div></div>
  </header>

  <div class="content">
    <div id="statusRegion" aria-live="polite"></div>

    <article id="missionContent" class="mission hidden">
      <header class="mission-hero">
        <div>
          <p class="eyebrow" id="missionMeta"></p>
          <h1 id="missionName"></h1>
          <p class="subtitle" id="missionSubtitle"></p>
          <p class="objective" id="missionObjective"></p>
        </div>
        <div class="summary-card">
          <div><small>Duração</small><strong id="missionDuration">—</strong></div>
          <div><small>Versão</small><strong id="missionVersion">—</strong></div>
          <div><small>Status</small><strong id="missionStatus">—</strong></div>
        </div>
      </header>

      <section class="notice">
        <strong>Visualização editorial</strong>
        <p>Esta tela não inicia execução, não marca exercícios e não altera o progresso do Aventureiro.</p>
      </section>

      <div id="sections"></div>
    </article>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./app.js"></script>
</body>
</html>
